            <!-- Add Expense Form -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Add New Expense</h5>
                    </div>
                    <div class="card-body">
                        <form action="../backend/expenses/add.php" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Amount (KSh)</label>
                                <input type="number" name="amount" step="0.01" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <input type="text" name="description" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Date</label>
                                <input type="date" name="expense_date" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <select name="category_id" class="form-control" id="category-select" required>
                                    <option value="">Loading categories...</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Add Expense</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <!-- Expenses List -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <h5 class="mb-0">Expense History</h5>
                        <div class="d-flex gap-2 align-items-center">
                            <input type="text" id="expense-search" class="form-control form-control-sm" placeholder="Search expenses..." style="width:200px;" oninput="filterExpenses()">
                            <a href="../backend/expenses/export.php" class="btn btn-success btn-sm">
                                <i class="fas fa-download me-1"></i>Export CSV
                            </a>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="expenses-list">
                            <div class="text-center">
                                <div class="spinner-border" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-2">Loading expenses...</p>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load categories and expenses
        async function loadPageData() {
            await loadUserInfo();
            await loadCategories();
            await loadExpenses();
        }
        
        async function loadUserInfo() {
            try {
                const response = await fetch('../backend/api/user.php');
                const data = await response.json();
                
                if (!data.authenticated) {
                    window.location.href = 'login.php';
                    return;
                }
                
                document.getElementById('user-dropdown').innerHTML = `<i class="fas fa-user-circle me-1"></i>${data.user_name}`;
            } catch (error) {
                console.error('Error loading user info:', error);
            }
        }
        
        async function loadCategories() {
            try {
                const response = await fetch('../backend/api/categories.php');
                const categories = await response.json();
                
                const select = document.getElementById('category-select');
                select.innerHTML = '<option value="">Select Category</option>';
                
                categories.forEach(category => {
                    select.innerHTML += `<option value="${category.id}">${category.name}</option>`;
                });
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }
        
        async function loadExpenses() {
            try {
                const response = await fetch('../backend/api/expenses.php');
                const data = await response.json();
                
                // Check if user is authenticated
                if (response.status === 401 || (data.error && data.error === 'Not authenticated')) {
                    window.location.href = 'login.php';
                    return;
                }
                
                const expenses = Array.isArray(data) ? data : [];
                const container = document.getElementById('expenses-list');
                
                if (expenses.length === 0) {
                    container.innerHTML = `
                        <div class="text-center text-muted py-5">
                            <i class="fas fa-receipt fa-4x mb-3"></i>
                            <h4>No expenses yet</h4>
                            <p>Start tracking your spending by adding your first expense.</p>
                            <p class="small">Use the form on the left to record your transactions.</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '<div class="table-responsive"><table class="table table-hover" id="expenses-table"><thead class="table-dark"><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Actions</th></tr></thead><tbody>';
                
                let total = 0;
                expenses.forEach(expense => {
                    total += parseFloat(expense.amount.replace(/,/g, ''));
                    html += `<tr>
                        <td>${expense.date}</td>
                        <td><span class="badge bg-secondary">${expense.category}</span></td>
                        <td>${expense.description}</td>
                        <td><strong>KSh ${expense.amount}</strong></td>
                        <td>
                            <form method="POST" action="../backend/expenses/delete.php" style="display: inline;">
                                <input type="hidden" name="expense_id" value="${expense.id}">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete this expense?')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>`;
                });
                
                html += '</tbody></table></div>';
                html += `<div class="d-flex justify-content-between align-items-center mt-3 px-1">
                    <small class="text-muted">${expenses.length} transaction${expenses.length !== 1 ? 's' : ''}</small>
                    <strong>Total: KSh ${total.toLocaleString('en-KE', {minimumFractionDigits:2, maximumFractionDigits:2})}</strong>
                </div>`;
                
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading expenses:', error);
                document.getElementById('expenses-list').innerHTML = `
                    <div class="alert alert-warning text-center">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>Unable to load expenses</strong><br>
                        Please check your connection and try again.
                    </div>
                `;
            }
        }
        
        // Set today's date as default
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.querySelector('input[name="expense_date"]').value = today;
            
            loadPageData();
        });
        
        function filterExpenses() {
            const search = document.getElementById('expense-search').value.toLowerCase();
            const table = document.getElementById('expenses-table');
            if (!table) return;
            const rows = table.querySelectorAll('tbody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(search) ? '' : 'none';
            });
        }
    </script>
